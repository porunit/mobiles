receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 2s
    limit_mib: 512
  resourcedetection:
    detectors: [env, system]

exporters:
  # Traces -> Jaeger (OTLP)
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  # Metrics -> Prometheus scrapes this endpoint
  prometheus:
    endpoint: 0.0.0.0:8889
  # Logs (and trace archive) -> ClickHouse; tables auto-created
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s
    database: analytics
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    create_schema: true
    ttl: 168h

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp/jaeger, clickhouse]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]
