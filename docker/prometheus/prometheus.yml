global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Metrics forwarded by the OTel collector (all instrumented services)
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  # Go receiver exposes Prometheus metrics directly (iteration 1)
  - job_name: go-receiver
    metrics_path: /metrics
    static_configs:
      - targets: ['go-receiver:8090']

  # Spring Boot db-service via Actuator/Micrometer (enabled once the service is up)
  - job_name: db-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['db-service:8081']

  # Ktor gateway metrics (Micrometer)
  - job_name: ktor-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['ktor-gateway:8080']
